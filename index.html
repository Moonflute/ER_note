<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#b4232e">
    <meta name="description" content="응급실 초진을 위한 증상별 문진·신체진찰 Quick Reference">
    <title>ER 초진 · Quick Reference</title>
    <link rel="stylesheet" href="./styles.css?v=2">

    <a class="skip-link" href="#main">본문으로 이동</a>

        <button type="button" class="icon-button" id="close-source" aria-label="출처 닫기">×</button>
